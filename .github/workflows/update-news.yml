name: Update news index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: update-news-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch and rank headlines
        run: python scripts/update_news.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No changes to the news index."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Refresh news index"
          # Reconcile concurrent commits before pushing the generated data.
          git pull --rebase origin main
          git push
